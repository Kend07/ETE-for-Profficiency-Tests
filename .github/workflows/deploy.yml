# ==========================================================================
# ETE for Proficiency Tests - Deploy a GitHub Pages
# --------------------------------------------------------------------------
# Despliega el sitio estatico en cada push a `main` (y manualmente).
# Nota: `enablement: true` en configure-pages habilita GitHub Pages de forma
# automatica (no hace falta activarlo a mano en Settings > Pages).
# ==========================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos: solo lectura del contenido y escritura en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deployment a la vez; si llega uno nuevo, cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  # Build: prepara el artefacto estatico.
  # ------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar GitHub Pages (habilita Pages + build con Actions)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Subir artefacto (archivos del sitio)
        uses: actions/upload-pages-artifact@v3
        with:
          # Publica la raiz del repo. Si se agrega un build (p. ej. Tailwind
          # purgado), cambiar por la ruta del artefacto resultante.
          path: .

  # ------------------------------------------------------------------------
  # Deploy: publica el artefacto en GitHub Pages.
  # ------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4